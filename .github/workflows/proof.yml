# The gate. Re-runs PROOF_CMD on every PR; branch protection makes this check
# required, so auto-merge cannot fire without it.
name: proof
on:
  pull_request:
  push:
    branches: [main]
jobs:
  proof:
    name: proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
